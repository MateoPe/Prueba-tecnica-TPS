spring.application.name=tps
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tps}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

app.security.jwt-secret=${JWT_SECRET:local-development-secret-change-before-deploy-32chars}
app.security.token-expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.discount.starts-at=${DISCOUNT_START:}
app.discount.ends-at=${DISCOUNT_END:}
app.discount.standard-percent=${DISCOUNT_STANDARD_PERCENT:10}
app.discount.random-percent=${DISCOUNT_RANDOM_PERCENT:50}
app.discount.frequent-percent=${FREQUENT_DISCOUNT_PERCENT:5}
app.discount.frequent-order-threshold=${FREQUENT_ORDER_THRESHOLD:5}
